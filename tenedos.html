:root{
 --ven:#d9443b;--gen:#2f6fd1;--ink:#24303a;--cream:#fff8ea;--line:#2b2f3a;
 --ok:#4cbb57;--ok-d:#2f8a3a;--gold:#ffc94a;--bad:#e0543f;--khan:#7a4fb0;
 --safe:env(safe-area-inset-top,0px);--safeb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1f8ea3;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{opacity:0!important;pointer-events:none!important}
.fade{transition:opacity .35s ease,transform .35s ease}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#ui>*{pointer-events:auto}
#ui>.pass{pointer-events:none}
/* buttons */
.btn{appearance:none;border:3px solid var(--line);border-radius:18px;padding:14px 26px 16px;font-family:'IM Fell English',serif;font-size:21px;color:#fff;background:var(--ok);box-shadow:0 6px 0 var(--line),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:#4a2c06;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.grey{background:#9aa6ae}
.btn.small{font-size:16px;padding:10px 16px 12px;border-radius:14px}
.panel{background:var(--cream);border:3px solid var(--line);border-radius:22px;box-shadow:0 8px 0 rgba(43,47,58,.85);position:relative}
.ribbon{position:absolute;left:50%;top:-20px;transform:translateX(-50%);padding:6px 20px 8px;border:3px solid var(--line);border-radius:12px;font-family:'IM Fell English',serif;font-size:18px;color:#fff;white-space:nowrap;box-shadow:0 4px 0 var(--line)}
.ribbon.V{background:var(--ven)}.ribbon.G{background:var(--gen)}.ribbon.N{background:#e09a2a}.ribbon.K{background:var(--khan)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe) + 10px) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none;z-index:4}
.chip{display:flex;align-items:center;gap:7px;background:var(--cream);border:3px solid var(--line);border-radius:16px;padding:5px 11px 6px 6px;box-shadow:0 4px 0 var(--line);font-family:'IM Fell English',serif;font-size:18px}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}
.chip .tb{width:24px;height:36px}
.chip small{display:block;font-family:Nunito;font-weight:800;font-size:10.5px;color:#6b7680;line-height:1;margin-bottom:2px}
.chip svg{width:22px;height:22px;flex:none}
.coinI{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc94a 45%,#c98a1c);border:2.5px solid var(--line);flex:none}
.pips{display:flex;gap:3px}
.pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);background:#d6dde0;transition:background .3s}
.pips i.on{background:var(--ok)}
.mini{padding:4px 10px 5px 8px;font-size:13px;font-family:Nunito;font-weight:900;color:#6b7680}
/* speech bubble */
#say{position:fixed;left:10px;right:10px;top:calc(var(--safe) + 104px);display:flex;justify-content:center;pointer-events:none;z-index:5}
#say .b{display:flex;align-items:center;gap:10px;max-width:360px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:8px 14px 9px 8px;animation:pop .28s cubic-bezier(.2,1.6,.5,1)}
#say .av{width:50px;height:50px;flex:none}
#say .who{font-weight:900;font-size:11px;letter-spacing:.06em;line-height:1;margin-bottom:3px}
#say .tx{font-weight:800;font-size:15.5px;line-height:1.25}
#say .tx b{color:var(--ven)}
@keyframes pop{0%{transform:scale(.7) translateY(-8px);opacity:0}100%{transform:none;opacity:1}}
.float{position:fixed;transform:translateX(-50%);font-family:'IM Fell English',serif;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;pointer-events:none;animation:fl 1.3s ease forwards;white-space:nowrap;z-index:6}
.float.good{color:var(--gold)}.float.bad{color:#ff7a66}
@keyframes fl{0%{opacity:0;margin-top:14px;scale:.6}18%{opacity:1;margin-top:0;scale:1.15}75%{opacity:1;scale:1}100%{opacity:0;margin-top:-44px}}
/* stage title */
#stage{position:fixed;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .3s}
#stage.on{opacity:1}
#stage .y{font-family:'IM Fell English',serif;font-size:76px;line-height:1;color:#fff;-webkit-text-stroke:11px var(--line);paint-order:stroke fill;text-shadow:0 7px 0 var(--line)}
#stage .n{display:inline-block;margin-top:12px;background:var(--line);color:#fff;font-weight:900;font-size:15px;letter-spacing:1.5px;padding:7px 16px;border-radius:999px}
/* log toast */
#toast{position:fixed;left:50%;bottom:calc(var(--safeb) + 22px);transform:translateX(-50%);width:min(340px,92vw);display:flex;align-items:center;gap:10px;padding:9px 12px 10px;background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);z-index:6;transition:all .45s cubic-bezier(.2,1.4,.5,1);opacity:0;pointer-events:none}
#toast.on{opacity:1}
#toast.fly{transition:all .55s ease-in;transform:translate(10vw,-90vh) scale(.2);opacity:0}
#toast svg{width:44px;height:44px;flex:none}
#toast .k{font-weight:900;font-size:10.5px;letter-spacing:.08em;color:#8a6d2b}
#toast .t{font-weight:800;font-size:14px;line-height:1.2}
/* decision */
.dec{position:fixed;left:12px;right:12px;bottom:calc(var(--safeb) + 14px);padding:28px 14px 14px;text-align:center}
.dec .q{font-family:'IM Fell English',serif;font-size:21px;line-height:1.15;margin:2px 0 12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{appearance:none;border:3px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 6px 0 var(--line);padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'IM Fell English',serif;font-size:17px;color:var(--ink);line-height:1.1}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.choice svg{width:50px;height:50px}
.choice small{font-family:Nunito;font-weight:800;font-size:11.5px;color:#6b7680;line-height:1.2}
.choice.a{background:#eaf7e6}.choice.b{background:#f1e9fb}
/* bread board */
.bread{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);width:290px;padding:26px 16px 16px;text-align:center}
.bread .row{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:120px;margin:10px 0 4px}
.bread .col{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:12px;color:#6b7680}
.bread .bar{width:46px;border:3px solid var(--line);border-radius:8px 8px 4px 4px;background:#e8b84a;height:0;transition:height .8s cubic-bezier(.2,1.2,.5,1)}
.bread .bar.hot{background:var(--bad)}
.bread .lab{font-family:'IM Fell English',serif;font-size:19px;color:var(--ink)}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe) + 24px) 20px calc(var(--safeb) + 24px)}
.logo{font-family:'IM Fell English',serif;font-size:58px;line-height:.95;color:#fff;-webkit-text-stroke:10px var(--line);paint-order:stroke fill;text-shadow:0 8px 0 var(--line);letter-spacing:1px}
.logo-sub{margin-top:14px;display:inline-block;background:var(--line);color:#fff;font-weight:800;font-size:13px;letter-spacing:1px;padding:6px 14px;border-radius:999px}
.flagbig{width:84px;height:126px;margin:26px auto 4px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(43,47,58,.85))}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.cap{font-weight:900;font-size:13px;letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.cityname{font-family:'IM Fell English',serif;font-size:34px;color:#fff;-webkit-text-stroke:7px var(--line);paint-order:stroke fill;margin:2px 0 22px}
.pickrow{display:flex;gap:14px;margin-top:26px}
.pick{appearance:none;border:3px solid var(--line);border-radius:20px;background:var(--cream);box-shadow:0 6px 0 var(--line);padding:12px 18px 14px;font-family:'IM Fell English',serif;font-size:20px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.pick img{width:48px;height:72px}
.credit{position:fixed;bottom:calc(var(--safeb) + 10px);left:0;right:0;text-align:center;font-weight:700;font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.hint{position:fixed;left:50%;bottom:calc(var(--safeb) + 26px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'IM Fell English',serif;font-size:19px;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;pointer-events:none;white-space:nowrap;z-index:3}
.hint .dot{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid #fff;box-shadow:0 0 0 3px var(--line);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.8)}}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeb) + 16px);width:200px;height:15px;border:3px solid var(--line);border-radius:10px;background:var(--cream);overflow:hidden;box-shadow:0 4px 0 var(--line)}
.timer b{display:block;height:100%;background:var(--gold);width:100%}
/* how-to-play card */
.howto{position:fixed;left:50%;bottom:calc(var(--safeb) + 16px);transform:translateX(-50%);width:min(352px,94vw);padding:28px 16px 16px;text-align:center;animation:popx .3s cubic-bezier(.2,1.6,.5,1)}
@keyframes popx{0%{transform:translateX(-50%) scale(.7);opacity:0}100%{transform:translateX(-50%);opacity:1}}
.howto .goal{font-family:'IM Fell English',serif;font-size:27px;line-height:1.05;margin:2px 0 10px}
.demo{height:112px;border-radius:14px;background:linear-gradient(#41c0d2,#2aa3bb);border:2.5px solid var(--line);position:relative;overflow:hidden;margin-bottom:10px}
.demo>*{position:absolute}
.demo .fg{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid #fff;box-shadow:0 0 0 2.5px var(--line);margin:-15px 0 0 -15px}
.demo .sh{width:46px;height:46px;margin:-23px 0 0 -23px}
.demo .bt svg,.demo .sm svg{width:40px!important;height:40px!important;margin:-20px 0 0 -20px!important}
.rl{display:flex;align-items:center;gap:9px;text-align:left;font-weight:800;font-size:14.5px;line-height:1.25;margin:7px 2px}
.rl i{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:15px;color:#fff;border:2.5px solid var(--line)}
.rl i.do{background:var(--ok)}.rl i.no{background:var(--bad)}
/* demo: drag */
.d-drag .sh{animation:dg 3s ease-in-out infinite}.d-drag .fg{animation:dg 3s ease-in-out infinite;animation-delay:-.12s;margin-top:22px}
@keyframes dg{0%{left:14%;top:70%}50%{left:52%;top:30%}100%{left:86%;top:70%}}
.d-drag .bt{left:60%;top:72%;animation:bt 3s ease-in-out infinite}
@keyframes bt{0%{left:70%;top:80%}50%{left:56%;top:58%}100%{left:76%;top:84%}}
/* demo: tap */
.d-tap .st{width:22px;height:22px;border-radius:50%;background:#9a8b70;border:3px solid var(--line);margin:-11px 0 0 -11px;animation:st 2.4s linear infinite}
@keyframes st{0%{left:10%;top:85%;opacity:1;transform:none}40%{left:45%;top:22%;opacity:1;transform:none}46%{left:48%;top:20%;opacity:0;transform:scale(2)}100%{opacity:0}}
.d-tap .fg{left:47%;top:22%;animation:tp 2.4s linear infinite}
@keyframes tp{0%,30%{opacity:0;transform:scale(1.4)}38%{opacity:1;transform:scale(1)}44%{transform:scale(.75)}60%,100%{opacity:0}}
.d-tap .wl{left:72%;top:58%;width:64px;height:40px;background:#d9c9a6;border:3px solid var(--line);border-radius:6px}
/* demo: block */
.d-block .sm{left:50%;animation:sm 3s linear infinite}
@keyframes sm{0%{top:110%;opacity:1}45%{top:52%;opacity:1}75%{top:52%;opacity:0}100%{top:52%;opacity:0}}
.d-block .sh{top:38%;animation:bl 3s ease-in-out infinite}.d-block .fg{top:38%;margin-top:20px;animation:bl 3s ease-in-out infinite}
@keyframes bl{0%{left:15%}40%,100%{left:50%}}
/* demo: hold */
.d-hold .sh{top:62%;animation:hs 4s linear infinite}
@keyframes hs{0%{left:10%}35%{left:45%}65%{left:45%}100%{left:85%}}
.d-hold .fg{left:84%;top:24%;animation:hf 4s linear infinite}
@keyframes hf{0%,35%{transform:scale(.8);opacity:1}36%,64%{transform:scale(1.2);opacity:.35}65%,100%{transform:scale(.8);opacity:1}}
.d-hold .cone{left:30%;top:-20%;width:120px;height:150px;background:radial-gradient(ellipse at 50% 0,rgba(255,236,150,.85),rgba(255,236,150,0) 70%);clip-path:polygon(50% 0,0 100%,100% 100%);transform-origin:50% 0;animation:cn 4s ease-in-out infinite}
@keyframes cn{0%,30%{transform:rotate(-45deg)}40%,60%{transform:rotate(0)}70%,100%{transform:rotate(45deg)}}
.d-hold .lb{left:6%;top:8%;font-weight:900;font-size:11px;color:#fff;text-shadow:0 1px 0 var(--line)}
/* demo: row */
.d-row .tg{left:50%;top:55%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#8a5a2e;border:4px solid var(--line)}
.d-row .ring{left:50%;top:55%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:5px solid #ffc94a;animation:rg 1.2s linear infinite}
@keyframes rg{0%{transform:scale(2.8);border-color:#ffc94a}85%{transform:scale(1.05);border-color:#4cbb57}100%{transform:scale(1);border-color:#4cbb57}}
.d-row .fg{left:66%;top:62%;animation:rt 1.2s linear infinite}
@keyframes rt{0%,80%{transform:scale(1.2);opacity:.4}90%{transform:scale(.75);opacity:1}100%{transform:scale(1.2);opacity:.4}}
.d-row .ok{left:50%;top:14%;transform:translateX(-50%);font-family:'IM Fell English';font-size:16px;color:#fff;-webkit-text-stroke:4px var(--line);paint-order:stroke fill;animation:ok 1.2s linear infinite}
@keyframes ok{0%,85%{opacity:0}90%,100%{opacity:1}}
/* demo: aim */
.d-aim .bow{left:50%;top:40%;width:34px;height:34px;margin:-17px 0 0 -17px}
.d-aim .fg{left:50%;top:40%;animation:am 2s ease-in-out infinite}
@keyframes am{0%{left:50%;top:40%;opacity:1}45%{left:35%;top:85%;opacity:1}50%,100%{left:35%;top:85%;opacity:0}}
.d-aim .ar{left:50%;top:40%;width:4px;height:18px;background:var(--line);border-radius:2px;margin:-9px 0 0 -2px;transform:rotate(-17deg);animation:ar 2s linear infinite}
@keyframes ar{0%,48%{opacity:0;left:50%;top:40%}50%{opacity:1;left:50%;top:40%}80%{opacity:1;left:62%;top:2%}81%,100%{opacity:0}}
.d-aim .tgt{left:64%;top:6%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:3px solid #e0453a}
/* demo: sink */
.d-sink .ch{left:70%;top:10%;width:40px;height:56px;background:#4fc0cf;border-left:5px solid #f6dfa6;border-right:5px solid #f6dfa6}
.d-sink .hk{width:36px;height:16px;border-radius:6px;background:#7d6d55;border:3px solid var(--line);margin:-8px 0 0 -18px;animation:hk 2.4s ease-in-out infinite}
@keyframes hk{0%,10%{left:22%;top:82%}60%,100%{left:75%;top:38%}}
.d-sink .fg{animation:hk 2.4s ease-in-out infinite;margin-top:4px}
/* demo: smash */
.d-smash .ch{left:42%;top:12%;width:56px;height:80px;background:#4fc0cf;border-left:6px solid #f6dfa6;border-right:6px solid #f6dfa6}
.d-smash .hk{left:42%;width:56px;height:14px;border-radius:5px;background:#7d6d55;border:3px solid var(--line);animation:sm2 1.6s steps(1) infinite}
.d-smash .hk.b{animation-delay:.8s}
@keyframes sm2{0%,60%{opacity:1}61%,100%{opacity:0}}
.d-smash .fg{left:56%;top:45%;animation:tp2 .4s ease-in-out infinite}
@keyframes tp2{50%{transform:scale(.7)}}
/* objective + result */
#obj{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeb) + 42px);display:flex;align-items:center;gap:8px;padding:6px 12px 7px;background:var(--cream);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);font-weight:900;font-size:14px;white-space:nowrap;z-index:3;pointer-events:none}
#obj.off{display:none}
#obj .bl{display:flex;gap:3px}#obj .bl b{width:13px;height:11px;border-radius:3px;background:#e8b84a;border:2px solid var(--line)}#obj .bl b.x{background:#d6dde0;border-style:dashed}
#res{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:all .3s cubic-bezier(.2,1.6,.5,1);z-index:7;padding:24px 22px 16px;text-align:center;pointer-events:none;min-width:240px}
#res.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#res .stars i{width:40px;height:40px}
#res .rt{font-family:'IM Fell English',serif;font-size:24px;margin-top:4px}
#res .rs{font-weight:800;font-size:14px;color:#6b7680;margin-top:2px}
/* history card */
.ctx{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,92vw);padding:30px 18px 18px;text-align:center;animation:popc .3s cubic-bezier(.2,1.6,.5,1);z-index:6}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%);opacity:1}}
.ctx .ct{font-family:'IM Fell English',serif;font-size:24px;line-height:1.1;margin:2px 0 10px}
.ctx p{font-weight:700;font-size:16px;line-height:1.5;color:#2f3742;margin:0 0 10px;text-align:left}
.ctx p b{color:#b8322a}
#ctxWash{position:fixed;inset:0;background:rgba(18,50,70,.5);z-index:5}
/* quiz (Kahoot-style) */
.qz{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe) + 14px) 12px calc(var(--safeb) + 14px);background:rgba(28,30,58,.94);z-index:9}
.qz .top{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:900;font-size:13px;letter-spacing:.06em;margin-bottom:10px}
.qz .qn{background:#fff;color:var(--ink);border-radius:12px;padding:4px 10px;border:3px solid var(--line)}
.qz .qq{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 #000;padding:18px 14px;font-family:'IM Fell English',serif;font-size:23px;line-height:1.2;text-align:center;color:var(--ink)}
.qz .clock{display:flex;justify-content:center;margin:14px 0}
.qz .clock div{width:66px;height:66px;border-radius:50%;background:#864cbf;border:4px solid #fff;color:#fff;font-family:'IM Fell English',serif;font-size:30px;display:flex;align-items:center;justify-content:center}
.qz .tbar{height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin-bottom:12px}.qz .tbar b{display:block;height:100%;background:#fff;width:100%;transition:width .1s linear}
.qz .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.qa{appearance:none;border:none;border-radius:14px;min-height:118px;padding:12px 10px;color:#fff;font-family:Nunito;font-weight:900;font-size:16px;line-height:1.2;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:opacity .25s,transform .25s}
.qa svg{width:26px;height:26px}
.qa:active{transform:translateY(3px)}
.qa.c0{background:#e21b3c}.qa.c1{background:#1368ce}.qa.c2{background:#d89e00}.qa.c3{background:#26890c}
.qa.dim{opacity:.28}.qa.good{outline:5px solid #fff;outline-offset:-5px}
.qz .fb{margin-top:12px;border-radius:16px;padding:12px;text-align:center;font-family:'IM Fell English',serif;font-size:24px;color:#fff;border:3px solid #fff}
.qz .fb.ok{background:#26890c}.qz .fb.no{background:#e21b3c}
.qz .ex{margin-top:10px;background:#fff8ea;border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;font-size:15.5px;line-height:1.35;color:var(--ink);text-align:left}
.qz .ex:before{content:'WHAT HAPPENED';display:block;font-weight:900;font-size:10.5px;letter-spacing:.08em;color:#8a6d2b;margin-bottom:3px}
.qz .fb small{display:block;font-family:Nunito;font-weight:800;font-size:14px;margin-top:3px}
/* log */
.log{width:100%;max-width:370px;padding:28px 10px 12px}
.slots{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.slot{height:52px;border:3px dashed #9aa6ae;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#f2ead6;position:relative;text-align:left}
.slot .n{width:24px;height:24px;border-radius:50%;background:var(--line);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.slot.filled{border-style:solid;border-color:var(--line);background:#fff}
.slot.right{background:#dff4dc;border-color:var(--ok-d)}.slot.wrong{background:#ffe1dc;border-color:#d0452f;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arrow{height:8px;display:flex;justify-content:center;margin:-3px 0}
.arrow:before{content:"";width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid var(--line)}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.lc{appearance:none;border:3px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--line);padding:5px 7px;display:flex;align-items:center;gap:7px;text-align:left;font-family:Nunito;font-weight:800;font-size:12.5px;line-height:1.12;color:var(--ink);min-height:54px}
.lc svg,.slot svg{width:38px;height:38px;flex:none}
.lc.sel{background:#fff1c9;outline:4px solid var(--gold);outline-offset:-1px}
.lc.used{visibility:hidden}
.slot .t{font-weight:800;font-size:12.5px;line-height:1.12}
.why{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.wopt{appearance:none;border:3px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);padding:11px 12px;font-family:Nunito;font-weight:800;font-size:15px;color:var(--ink);text-align:left}
.wopt.right{background:#dff4dc;border-color:var(--ok-d)}.wopt.wrong{background:#ffe1dc;border-color:#d0452f;animation:shake .4s}
.note{font-weight:800;font-size:14px;line-height:1.4;color:#3b4250;margin:12px 4px 4px}
/* receipt */
.rec{width:300px;padding:34px 22px 22px;text-align:center}
.rec .big{font-family:'IM Fell English',serif;font-size:84px;line-height:1;color:var(--ink)}
.rec .lbl{font-weight:800;font-size:13px;color:#6b7680}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars i{width:34px;height:34px;background:#d6dde0;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%)}
.stars i.on{background:var(--gold)}
.rline{border-top:3px dashed #d6cdb6;margin:14px 0 12px}

/* ===== sea-chart theme ===== */
:root{--ink:#3a2a1c;--cream:#f6ecd2;--line:#4a3726;--ok:#6f8f35;--ok-d:#4f6a22;--gold:#c99a2e;--bad:#a8402e;--ven:#a8322a;--gen:#2f5f8a}
html,body{background:#e9dab3;color:var(--ink)}
.panel{background:#f6ecd2;background-image:radial-gradient(rgba(140,100,50,.07) 1px,transparent 1.5px);background-size:7px 7px;border:3px solid var(--line);box-shadow:0 6px 0 rgba(74,55,38,.9),inset 0 0 0 4px rgba(201,154,46,.18)}
.ribbon{border-color:var(--line);box-shadow:0 4px 0 var(--line);font-style:italic}
.ribbon.N{background:#8c2f24}.ribbon.V{background:#a8322a}.ribbon.G{background:#2f5f8a}.ribbon.K{background:#5b3a7a}
.btn{background:#8c2f24;border-color:var(--line);box-shadow:0 6px 0 var(--line),inset 0 -5px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.2);color:#f6ecd2;font-style:italic}
.btn.gold{background:#c99a2e;color:#3a2a1c}
.btn.grey{background:#8f8270}
.chip{background:#f6ecd2;border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.chip small{color:#7a6248}
.coinI{border-color:var(--line)}
#say .b{background:#f6ecd2;border-color:var(--line);box-shadow:0 5px 0 var(--line)}
#say .tx b,.ctx p b{color:#8c2f24}
.logo{color:#f6ecd2;-webkit-text-stroke:10px #4a3726;text-shadow:0 7px 0 #4a3726;font-size:62px;letter-spacing:2px}
.logo-sub,.n{background:#4a3726!important}
#stage .y{color:#f6ecd2;-webkit-text-stroke:11px #4a3726;text-shadow:0 7px 0 #4a3726}
.cityname,.sec,.hint,.float{-webkit-text-stroke-color:#4a3726}
.cap{color:#f6ecd2;text-shadow:0 2px 0 #4a3726}
.credit{color:#4a3726;text-shadow:none}
.demo{background:linear-gradient(#efe2c0,#dcc79a);border-color:var(--line)}
.demo .fg{border-color:#8c2f24;background:rgba(140,47,36,.25);box-shadow:0 0 0 2.5px var(--line)}
.howto .goal,.ctx .ct,.rec .big,.qz .qq{font-style:italic}
.rl i.do{background:#6f8f35}.rl i.no{background:#a8402e}
#ctxWash{background:rgba(58,42,28,.45)}
#obj,#toast{background:#f6ecd2;border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.timer{background:#f6ecd2;border-color:var(--line)}.timer b{background:#c99a2e}
#toast .k{color:#8c2f24}
.qz{background:rgba(58,42,28,.95)}
.qz .qq{background:#f6ecd2;border-color:var(--line)}
.qz .qn{background:#f6ecd2;border-color:var(--line)}
.qz .clock div{background:#8c2f24;border-color:#f6ecd2}
.qa.c0{background:#a8402e}.qa.c1{background:#2f5f8a}.qa.c2{background:#b8892c}.qa.c3{background:#4f7a33}

/* ---------------- history cards + quizzes ---------------- */
const CTX={
 1376:{t:'Tenedos, 1376',p:['<b>Tenedos</b> is a small island at the mouth of the <b>Dardanelles</b>, the sea gate to Constantinople and the Black Sea.','Byzantine Emperor <b>John V</b> agreed to give it to <b>Venice</b> in return for cancelling his debts. In 1376 his son <b>Andronikos IV</b>, helped by Genoa, overthrew him and gave the island to <b>Genoa</b> instead.']},
 1377:{t:'The fight for Tenedos, 1377–1378',p:['<b>Venice took Tenedos first</b> in 1376. Genoa refused to accept it, because whoever held the island could watch every ship heading for the Black Sea.','Genoa attacked, but the Venetians held on. The Venetian commander <b>Carlo Zeno</b> made his name at Tenedos. By <b>1378</b> it was open war: the <b>War of Chioggia</b>.']},
 1379:{t:'Chioggia, 1379',p:['In 1379 a Genoese fleet beat the Venetians at <b>Pola</b>, sailed into the Venetian lagoon and <b>captured Chioggia</b>, a port at its southern end.','Genoa\'s allies, <b>Hungary and Padua</b>, closed in by land. Venice itself was <b>almost surrounded</b>.']},

 [{q:'Where is Tenedos?',a:['In the Venetian lagoon','At the mouth of the Dardanelles','In the Black Sea','Next to Crimea'],k:1},

 ['Tenedos sits at the mouth of the Dardanelles, the sea gate to Constantinople and the Black Sea.','In 1376 Andronikos IV overthrew his father John V with Genoa\'s help and gave Genoa the island.','Whoever held Tenedos could watch every ship heading for the Black Sea.'],

  window.qPick=j=>{if(picked!=null||iv==null)return;picked=j;clearInterval(iv);iv=null;const el=(performance.now()-t0)/1000;const ok=j===Q.k;const pts=ok?Math.round(1000-400*clamp(el/LIM,0,1)):0;

 A={kind:'xbow',t:0,dur:18,origin,bolts:[],targets:[],next:.6,hits:0,lost:0,shots:0};
 stage(1377,'THE FIGHT FOR TENEDOS','TENEDOS',()=>{
  talk([[SIDE==='V'?'rival':'mate',SIDE==='V'?'That island is ours! <b>Attack!</b>':'Take it back from Venice! <b>Attack!</b>']],()=>{
   howTo(SIDE==='V'?'Hold Tenedos':'Storm Tenedos','aim',SIDE==='V'?'<b>Pull back</b> on the screen and <b>let go</b> to fire at Genoese boats.':'<b>Pull back</b> and <b>let go</b> to fire at the Venetian defenders on the walls.',SIDE==='V'?'Every boat that lands damages the fort.':'Defenders duck down after a moment. Be quick.',()=>{
    G.scene='xbow';setUI(`<div class="timer pass"><b id="tbar"></b></div>`);
    later(2600,()=>say('mate',SIDE==='V'?'Whoever holds Tenedos watches every ship going to <b>the Black Sea</b>.':'With Tenedos, Venice could <b>block our road</b> to the Black Sea.'));
   })})})
}
const DEF=[[384,532],[424,532],[384,562],[424,562],[404,528],[404,566]];
function xbowUpdate(dt){
 A.t+=dt;$('#tbar')&&($('#tbar').style.width=clamp(1-A.t/A.dur,0,1)*100+'%');
 A.next-=dt;if(A.next<=0&&A.t<A.dur-1.2){
  if(SIDE==='V'){A.next=rnd(1,1.4);const top=Math.random()<.55;const x0=top?rnd(300,470):rnd(290,460),y0=top?395:735;A.targets.push({x:x0,y:y0,spd:rnd(22,30),hp:1})}
  else{A.next=rnd(.7,1);const p=DEF[(Math.random()*DEF.length)|0];if(!A.targets.some(q=>!q.gone&&q.x===p[0]&&q.y===p[1]))A.targets.push({x:p[0],y:p[1],life:1.7,up:0,hp:1})}}
 for(const g of A.targets){if(g.gone)continue;
  if(SIDE==='V'){const dx=CASTLE[0]-g.x,dy=CASTLE[1]-g.y,d=Math.hypot(dx,dy);g.a=heading(dx,dy);if(d>58){g.x+=dx/d*g.spd*dt;g.y+=dy/d*g.spd*dt}else{g.gone=1;A.lost++;G.towerHp=Math.max(0,G.towerHp-1);G.shake=8;buzz(50);const[X,Y]=P(g.x,g.y);float('They landed!','bad',X,Y-30)}}
  else{g.up=Math.min(1,g.up+dt*5);g.life-=dt;if(g.life<=0){g.gone=1;A.lost++}}}
 for(const b of A.bolts){if(b.done)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.d+=Math.hypot(b.vx,b.vy)*dt;if(b.d>b.max)b.done=1;
  for(const g of A.targets){if(g.gone)continue;if(Math.hypot(g.x-b.x,g.y-b.y)<(SIDE==='V'?17:10)){g.gone=1;b.done=1;A.hits++;burst(g.x,g.y,SIDE==='V'?'#e0603f':'#d9c9a6');const[X,Y]=P(g.x,g.y);addCoins(1,X,Y-26);buzz(25);break}}}
 obj(SIDE==='V'?`Boats sunk ${A.hits} · landed ${A.lost}`:`Defenders hit ${A.hits} · missed ${A.lost}`);
 if(A.t>=A.dur&&A.targets.every(g=>g.gone)){G.scene='cut';setUI('');hush();const st=A.lost<=1?3:A.lost<=4?2:1;
  result(st,RATE[st],SIDE==='V'?`${A.hits} boats sunk`:`${A.hits} defenders hit`,()=>{
   say('mate',SIDE==='V'?'They\'ve pulled back. <b>Tenedos holds!</b>':'Their walls held... <b>but this is war now.</b>');
   later(3000,()=>page(1,()=>quizRound(1,()=>fadeTo(lagoonStage))))})}
}
function aimVec(){const dx=ptr.sx-ptr.x,dy=ptr.sy-ptr.y,d=Math.hypot(dx,dy);return{dx,dy,d}}
function fireBolt(){const v=aimVec();if(v.d<14)return;const sp=340,ux=v.dx/v.d,uy=v.dy/v.d;A.shots++;A.bolts.push({x:A.origin[0],y:A.origin[1],vx:ux*sp,vy:uy*sp,d:0,max:clamp(v.d*1.6,90,300)})}
function drawXbow(t){
 for(const g of A.targets){if(g.gone)continue;const[X,Y]=P(g.x,g.y);
  if(SIDE==='V')galley(X,Y,g.a||0,.62,SAIL.gen,t+g.x,{fast:1});
  else{const s=Math.min(SC,1.7);cx.save();cx.translate(X,Y-(1-g.up)*0);cx.fillStyle='#f2c79b';cx.strokeStyle='#2b2f3a';cx.lineWidth=2;cx.beginPath();cx.arc(0,-6*s,5*s,0,7);cx.fill();cx.stroke();cx.fillStyle='#d9443b';rr(-6*s,-2*s,12*s,12*s,3*s);cx.fill();cx.stroke();cx.fillStyle='#ffc94a';cx.beginPath();cx.arc(0,4*s,2.5*s,0,7);cx.fill();cx.restore();
   cx.strokeStyle=`rgba(255,90,60,${clamp(g.life,0,1)})`;cx.lineWidth=2;cx.beginPath();cx.arc(X,Y-2,12*Math.min(SC,1.7),0,7);cx.stroke()}}
 const[ox,oy]=P(...A.origin);
 if(SIDE==='G')galley(ox,oy+18,0,.8,SAIL.gen,t,{still:1});
 for(const b of A.bolts){if(b.done)continue;const[X,Y]=P(b.x,b.y);cx.strokeStyle='#2b2f3a';cx.lineWidth=3;cx.beginPath();const l=Math.hypot(b.vx,b.vy);cx.moveTo(X,Y);cx.lineTo(X-b.vx/l*16,Y-b.vy/l*16);cx.stroke()}
 // crossbow
 const v=ptr.down&&G.scene==='xbow'?aimVec():{dx:0,dy:-1,d:0};const ang=Math.atan2(v.dx,-v.dy);
 cx.save();cx.translate(ox,oy);cx.rotate(ang);cx.strokeStyle='#2b2f3a';cx.lineWidth=3;cx.fillStyle='#8a5a2e';rr(-4,-4,8,30,3);cx.fill();cx.stroke();cx.beginPath();cx.moveTo(-18,4);cx.quadraticCurveTo(0,-10,18,4);cx.stroke();cx.restore();
 if(ptr.down&&G.scene==='xbow'&&v.d>14){const k=clamp(v.d*1.6,90,300)*SC;cx.setLineDash([6,7]);cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=3;cx.beginPath();cx.moveTo(ox,oy);cx.lineTo(ox+v.dx/v.d*k,oy+v.dy/v.d*k);cx.stroke();cx.setLineDash([])}
}
/* =========================================================
   ROUND 3 · 1379–80 CHIOGGIA (Venice: drag stone ships into channels · Genoa: smash the barriers)
   ========================================================= */
function lagoonStage(){
 G.scene='cut';setUI('');view('lagoon',true);hud(true);
 CHANNELS.forEach(c=>{c.hp=SIDE==='V'?0:2;c.taps=0});
 A={kind:'lagoon',t:0,dur:22,gal:[],next:1.2,hulks:2,regen:0,escaped:0,trapped:0,food:1,drag:false,vnext:2.4,waiting:5};
 stage(1379,'TRAPPED AT CHIOGGIA','LAGOON',()=>{
  talk([['mate',SIDE==='V'?'The Genoese hold Chioggia, <b>at our doorstep</b>!':'We hold Chioggia! Venice is <b>almost surrounded</b>.']],()=>{
   if(SIDE==='V')howTo('Trap the Genoese fleet','sink','<b>Drag</b> a stone-filled ship from the tray <b>onto a channel</b>. Two ships close it.','Genoese galleys escape through any open channel.',go);
   else howTo('Break out to the sea','smash','<b>Tap a blocked channel fast</b> to clear the sunken ships. Your galleys sail out when it opens.','Venice keeps sinking new ships. Your food runs out.',go);
   function go(){G.scene='lagoon';setUI(`<div class="timer pass"><b id="tbar"></b></div>`);
    later(2600,()=>say('mate',SIDE==='V'?'Old ships, filled with stones. <b>Sink them in the channels!</b>':'They\'re sinking ships to <b>trap us in here</b>!'));
    if(SIDE==='G')later(11000,()=>{if(G.scene==='lagoon')say('mate','Our bread is almost gone...')})}
  })})
}
function chPos(c){return[492,c.y]}
function lagoonUpdate(dt){
 A.t+=dt;$('#tbar')&&($('#tbar').style.width=clamp(1-A.t/A.dur,0,1)*100+'%');
 if(SIDE==='V'){A.regen+=dt;if(A.regen>2&&A.hulks<3){A.regen=0;A.hulks++}
  A.next-=dt;if(A.next<=0&&A.t<A.dur-3){A.next=rnd(2.1,2.7);A.gal.push({x:CHIOGGIA[0],y:CHIOGGIA[1]-20,tgt:null,st:'go'})}}
 else{A.food=clamp(1-A.t/A.dur,0,1);A.vnext-=dt;if(A.vnext<=0&&A.t<A.dur-1){A.vnext=rnd(2.2,2.8);const c=CHANNELS[(Math.random()*3)|0];if(c.hp<4){c.hp++;const[X,Y]=P(...chPos(c));float('Sunk!','bad',X,Y-20);burst(492,c.y,'#7d6d55',8)}}
  A.waiting-=0;if(A.gal.filter(g=>g.st==='go').length===0&&A.t<A.dur-2){const open=CHANNELS.filter(c=>c.hp===0);if(open.length)A.gal.push({x:CHIOGGIA[0],y:CHIOGGIA[1]-20,tgt:open[0],st:'go'})}}
 for(const g of A.gal){if(g.st==='done')continue;
  if(SIDE==='V'&&g.st==='go'){const best=[...CHANNELS].sort((a,b)=>(a.hp-b.hp)||(Math.abs(a.y-g.y)-Math.abs(b.y-g.y)))[0];if(best.hp<2)g.tgt=best;else if(!g.tgt||g.tgt.hp>=2){g.st='back';A.trapped++;const[X,Y]=P(g.x,g.y);float('Trapped!','good',X,Y-30);addCoins(2,X,Y-50)}}
  if(g.st==='go'&&g.tgt){const[tx,ty]=chPos(g.tgt);const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);const sp=(g.tgt.hp===1?26:46);g.a=heading(dx,dy);
   if(d>8){g.x+=dx/d*sp*dt;g.y+=dy/d*sp*dt}
   if(d<26&&g.tgt.hp>=(SIDE==='V'?2:1)){g.st='back';const[X,Y]=P(g.x,g.y);float('Blocked!','good',X,Y-30);if(SIDE==='V'){A.trapped++;addCoins(2,X,Y-50)}}
   else if(d<=8){g.st='out'}}
  if(g.st==='out'){g.x+=60*dt;g.a=Math.PI/2;if(g.x>575){g.st='done';A.escaped++;const[X,Y]=P(560,g.y);if(SIDE==='V'){float('Escaped!','bad',X,Y-20);G.shake=6}else{float('Escaped!','good',X,Y-20);addCoins(3,X,Y-40)}}}
  if(g.st==='back'){const dx=CHIOGGIA[0]-g.x,dy=CHIOGGIA[1]-20-g.y,d=Math.hypot(dx,dy);g.a=heading(dx,dy);if(d>6){g.x+=dx/d*40*dt;g.y+=dy/d*40*dt}else g.st='done'}}
 obj(SIDE==='V'?`Trapped ${A.trapped} · escaped ${A.escaped} · stone ships ${'▮'.repeat(A.hulks)}`:`Escaped ${A.escaped} · food ${Math.round(A.food*100)}%`);
 if(A.t>=A.dur&&A.gal.every(g=>g.st==='done'||g.st==='back')){G.scene='cut';setUI('');hush();
  const st=SIDE==='V'?(A.escaped===0?3:A.escaped<=2?2:1):(A.escaped>=4?3:A.escaped>=2?2:1);
  result(st,RATE[st],SIDE==='V'?`${A.escaped} galleys escaped`:`${A.escaped} galleys broke out`,()=>{
   say('mate',SIDE==='V'?'Carlo Zeno\'s fleet is back! <b>The trap is shut.</b>':'Most of our fleet is <b>stuck inside</b>. We are starving.');
   later(3000,()=>page(2,()=>ctx(REVEAL,()=>quizRound(2,()=>fadeTo(peaceStage)))))})}
}
function lagoonDown(x,y){
 if(SIDE==='V'){if(y>SH-190&&y<SH-100&&A.hulks>0){A.drag=true}}
 else{let best=null,bd=1e9;for(const c of CHANNELS){const[X,Y]=P(...chPos(c));const d=Math.hypot(X-x,Y-y);if(d<bd){bd=d;best=c}}
  if(best&&bd<70&&best.hp>0){best.taps++;burst(492,best.y,'#b9a98a',4);buzz(15);if(best.taps>=4){best.taps=0;best.hp--;const[X,Y]=P(...chPos(best));float(best.hp?'Cleared one!':'Open!','good',X,Y-24)}}}
}
function lagoonUp(x,y){if(!A.drag)return;A.drag=false;let best=null,bd=1e9;for(const c of CHANNELS){const[X,Y]=P(...chPos(c));const d=Math.hypot(X-x,Y-y);if(d<bd){bd=d;best=c}}
 if(best&&bd<80&&best.hp<3){best.hp++;A.hulks--;burst(492,best.y,'#7d6d55',10);buzz(30);const[X,Y]=P(...chPos(best));float(best.hp>=2?'Closed!':'Half closed','good',X,Y-24)}}
function drawLagoonPlay(t){
 for(const g of A.gal){if(g.st==='done')continue;const[X,Y]=P(g.x,g.y);galley(X,Y,g.a||0,.62,SAIL.gen,t+g.y,{fast:1})}
 // waiting Genoese fleet at Chioggia
 for(let k=0;k<3;k++){const[X,Y]=P(CHIOGGIA[0]-30+k*30,CHIOGGIA[1]-48);galley(X,Y,0,.5,SAIL.gen,t,{still:1,furled:1})}
 if(SIDE==='V'){const n=A.hulks;const tw=210,tx=(SW-tw)/2,ty=SH-176;cx.fillStyle='rgba(255,248,234,.94)';rr(tx,ty,tw,64,16);cx.fill();cx.strokeStyle='#2b2f3a';cx.lineWidth=3;cx.stroke();
  for(let k=0;k<3;k++){const X=tx+40+k*65,Y=ty+32;if(k<n)galley(X,Y,Math.PI/2,.55,SAIL.hulk,t,{still:1,furled:1,stones:1});else{cx.strokeStyle='rgba(43,47,58,.3)';cx.setLineDash([4,4]);cx.strokeRect(X-24,Y-12,48,24);cx.setLineDash([])}}
  if(A.drag){galley(ptr.x,ptr.y,Math.PI/2,.65,SAIL.hulk,t,{still:1,furled:1,stones:1});for(const c of CHANNELS){const[X,Y]=P(...chPos(c));cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=3;cx.setLineDash([5,5]);cx.beginPath();cx.arc(X,Y,30,0,7);cx.stroke();cx.setLineDash([])}}}
 else{for(const c of CHANNELS){if(c.hp<=0)continue;const[X,Y]=P(...chPos(c));cx.strokeStyle='#ffc94a';cx.lineWidth=4;cx.beginPath();cx.arc(X,Y,28,-Math.PI/2,-Math.PI/2+Math.PI*2*(c.taps/4));cx.stroke()}}
}
/* =========================================================
   ROUND 4 · 1381 PEACE OF TURIN
   ========================================================= */
function peaceStage(){
 G.scene='cut';setUI('');view('tenedos',true);G.ten='ven';G.towerHp=6;hud(true);A={kind:'peace',t:0};
 stage(1381,'THE PEACE OF TURIN','TENEDOS',()=>{
  say('mate','Five years of war... and Tenedos goes to <b>no one</b>.',3000);
  later(800,()=>{G.ten='rubble';G.shake=10;burst(CASTLE[0],CASTLE[1],'#b9ad94',24);buzz([60,40,60])});
  later(3400,()=>page(3,()=>quizRound(3,()=>fadeTo(receipt))))})
}
/* ---------------- input routing ---------------- */
function onTap(x,y){
 if(G.scene==='race'&&A&&!A.done)rowTap();
 if(G.scene==='lagoon')lagoonDown(x,y);
}
function onUp(x,y){
 if(G.scene==='xbow')fireBolt();
 if(G.scene==='lagoon')lagoonUp(x,y);
}
/* ---------------- receipt ---------------- */
const BOARD=typeof BOARDN!=='undefined'?BOARDN:'Tana';const SCORE={V:[12,20],G:[14,24]};
window.receipt=()=>{
 G.scene='menu';hud(false);obj(null);hush();const p=G.purse,trade=p>=SCORE[SIDE][1]?2:p>=SCORE[SIDE][0]?1:0;
 const acc=G.qTotal?G.qRight/G.qTotal:0,insight=acc>=.75?1:0,bonus=trade+insight;
 setUI(`<div class="screen"><div class="panel rec"><div class="ribbon ${SIDE}">${CITY[SIDE]}</div>
 <div class="lbl">AT THE TABLE, GIVE</div><div class="big">+${bonus}</div><div class="lbl">coins in the ${BOARD} round to</div><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px"><img src="${furl(sk(SIDE))}" style="width:40px;height:60px"><span style="font-family:'IM Fell English';font-size:36px;color:${SIDE==='V'?'var(--ven)':'var(--gen)'}">${CITY[SIDE]}</span></div>
 <div class="stars">${[0,1,2].map(i=>`<i class="${i<bonus?'on':''}"></i>`).join('')}</div>
 <div class="rline"></div><div style="font-weight:800;font-size:14px;line-height:1.6">Voyages: ${p} coins · ${'★'.repeat(trade)||'–'}<br>Quizzes: ${G.qRight}/${G.qTotal} right · ${insight?'★':'–'}</div>
 </div><div class="cap" style="margin-top:22px;font-size:14px">Show this screen at the table</div><div style="height:14px"></div><button class="btn small grey" onclick="location.reload()">Play again</button></div>`);
 buzz(60);
};
/* =========================================================
   TITLE
   ========================================================= */
function title(){
 G.scene='title';hud(false);view('aegean',true);G.ten='byz';
 setUI(`<div class="screen"><div class="logo">TENEDOS</div><div class="logo-sub">THE LAST WAR · 1376–1381</div>
 ${SIDE?`<img class="flagbig" src="${furl(sk(SIDE))}"><div class="cap">YOU ARE A CAPTAIN OF</div><div class="cityname">${CITY[SIDE]}</div><button class="btn gold" onclick="begin()">Play</button>`
 :`<div class="pickrow"><button class="pick" onclick="pick('V')"><img src="${furl('ven')}">Venice</button><button class="pick" onclick="pick('G')"><img src="${furl('gen')}">Genoa</button></div><div class="cap" style="margin-top:14px">Pick your city</div>`}
 </div><div class="credit">Characters and scenes are game reconstructions of real events.</div>`);
}
window.pick=s=>{SIDE=s;title()};
window.begin=()=>{G.purse=0;G.pages=[];G.qRight=0;G.qTotal=0;G.qPts=0;fadeTo(raceStage)};
/* =========================================================
   LOOP + DRAW
   ========================================================= */
let fadeA=0,fadeCb=null;function fadeTo(cb){fadeA=.001;fadeCb=cb}window.fadeTo=fadeTo;
function drawScene(t){
 for(let i=0;i<4;i++)VW[i]=lerp(VW[i],TV[i],.06);fit();
 if(MAP==='lagoon')drawLagoon(t);else drawAegean(t);
 if(G.scene==='title'||G.scene==='menu'){cx.fillStyle='rgba(58,42,28,.3)';cx.fillRect(0,0,SW,SH);return}
 if(!A)return;
 if(A.kind==='race'){const pv=(SIDE==='V'?PATH_V:PATH_G).at(A.me*(SIDE==='V'?PATH_V:PATH_G).len),pr=(SIDE==='V'?PATH_G:PATH_V).at(A.riv*(SIDE==='V'?PATH_G:PATH_V).len);
  const[hx,hy]=P(...HARBOR);cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=3;cx.setLineDash([6,6]);cx.beginPath();cx.arc(hx,hy,24*Math.min(SC,1.6),0,7);cx.stroke();cx.setLineDash([]);
  galley(...P(pr.x,pr.y),pr.a,.8,SAIL[sk(OTHER(SIDE))],t,{fast:1});galley(...P(pv.x,pv.y),pv.a,.9,SAIL[sk(SIDE)],t,{fast:1});
  if(G.scene==='race')drawRaceUI(t)}
 if(A.kind==='xbow')drawXbow(t);
 if(A.kind==='lagoon')drawLagoonPlay(t);
 for(const p of PARTS){p.l-=1/60*1.6;p.x+=p.vx/60;p.y+=p.vy/60;if(p.l<=0)continue;cx.globalAlpha=clamp(p.l,0,1);cx.fillStyle=p.c;const[X,Y]=P(p.x,p.y);cx.beginPath();cx.arc(X,Y,3*Math.min(SC,1.7),0,7);cx.fill();cx.globalAlpha=1}
 for(let i=PARTS.length-1;i>=0;i--)if(PARTS[i].l<=0)PARTS.splice(i,1);
}
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;G.t+=dt;
 cx.setTransform(DPR,0,0,DPR,0,0);
 if(G.shake>0){G.shake=Math.max(0,G.shake-dt*40);cx.translate(rnd(-1,1)*G.shake*.5,rnd(-1,1)*G.shake*.5)}
 if(A){if(G.scene==='race'||(A.kind==='race'&&A.done))raceUpdate(dt);if(G.scene==='xbow')xbowUpdate(dt);if(G.scene==='lagoon')lagoonUpdate(dt)}
 drawScene(G.t);
 if(fadeA>0){fadeA+=dt*1.8;const a=fadeA<1?fadeA:2-fadeA;cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=`rgba(74,55,38,${clamp(a,0,1)})`;cx.fillRect(0,0,SW,SH);if(fadeA>=1&&fadeCb){const f=fadeCb;fadeCb=null;f()}if(fadeA>=2)fadeA=0}
 requestAnimationFrame(frame)}
title();requestAnimationFrame(frame);
</script>
