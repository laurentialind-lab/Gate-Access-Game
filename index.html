:root{
 --ven:#d9443b;--ven-d:#9c2a23;--gen:#2f6fd1;--gen-d:#1d4a96;
 --sea:#27a9bf;--ink:#24303a;--cream:#fff8ea;--sand:#f3dca4;--line:#2b2f3a;
 --ok:#4cbb57;--ok-d:#2f8a3a;--gold:#ffc94a;--gold-d:#d9952a;
 --safe:env(safe-area-inset-top,0px);--safeb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1f8ea3;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{opacity:0!important;pointer-events:none!important}
.fade{transition:opacity .35s ease,transform .35s ease}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}

/* type */
.disp{font-family:'Bree Serif',Georgia,serif;font-weight:400}

/* chunky buttons */
.btn{appearance:none;border:3px solid var(--line);border-radius:18px;padding:14px 26px 16px;font-family:'Bree Serif',serif;font-size:21px;color:#fff;background:var(--ok);box-shadow:0 6px 0 var(--line),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:#4a2c06;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.blue{background:#3d8fe0}.btn.red{background:#e0543f}.btn.grey{background:#9aa6ae}
.btn.small{font-size:16px;padding:10px 16px 12px;border-radius:14px}
.btn .ic{width:28px;height:28px;flex:none}

/* panels */
.panel{background:var(--cream);border:3px solid var(--line);border-radius:22px;box-shadow:0 8px 0 rgba(43,47,58,.85);position:relative}
.ribbon{position:absolute;left:50%;top:-20px;transform:translateX(-50%);padding:6px 20px 8px;border:3px solid var(--line);border-radius:12px;font-family:'Bree Serif',serif;font-size:18px;color:#fff;white-space:nowrap;box-shadow:0 4px 0 var(--line)}
.ribbon.V{background:var(--ven)}.ribbon.G{background:var(--gen)}.ribbon.N{background:#e09a2a}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.chip{display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--line);border-radius:16px;padding:5px 12px 6px 6px;box-shadow:0 4px 0 var(--line);font-family:'Bree Serif',serif;font-size:18px}
.chip .tb{width:26px;height:38px}
.chip small{display:block;font-family:Nunito;font-weight:800;font-size:11px;color:#6b7680;line-height:1;margin-bottom:2px}
.coinI{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc94a 45%,#c98a1c);border:2.5px solid var(--line)}
#route{position:fixed;left:12px;top:calc(var(--safe) + 82px);bottom:calc(var(--safeb) + 90px);width:10px;pointer-events:none}
#route .bar{position:absolute;left:3px;top:0;bottom:0;width:4px;border-radius:3px;background:rgba(255,255,255,.45)}
#route .wp{position:absolute;left:-1px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--line)}
#route .wp span{position:absolute;left:18px;top:-5px;font-weight:800;font-size:11px;color:#fff;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.45),0 0 6px rgba(0,0,0,.35)}
#route .wp.gate{background:#ffc94a}
#route .me{position:absolute;left:-4px;width:18px;height:18px;border-radius:50%;border:3px solid var(--line);box-shadow:0 2px 0 var(--line)}
#hold{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeb) + 14px);display:flex;gap:5px;padding:7px 9px;border-radius:16px;background:var(--cream);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);pointer-events:none}
.bale{width:26px;height:22px;border-radius:5px;background:#e7c47a;border:2.5px solid var(--line);position:relative;transition:all .3s}
.bale:after{content:"";position:absolute;left:9px;top:0;bottom:0;width:4px;background:#b97c35}
.bale.lost{background:#d6dde0;border-style:dashed;border-color:#9aa6ae}.bale.lost:after{display:none}
.bale.hit{animation:hit .5s}@keyframes hit{0%{transform:scale(1.35) rotate(-8deg);background:#ff6b55}100%{transform:none}}

/* speech/coach bubble */
#coach{position:fixed;left:50%;top:calc(var(--safe) + 92px);transform:translateX(-50%);max-width:300px;width:max-content;padding:10px 16px 12px;background:var(--cream);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);font-weight:800;font-size:15px;line-height:1.3;text-align:center;pointer-events:none}
#coach b{color:var(--ven)}
.float{position:fixed;transform:translateX(-50%);font-family:'Bree Serif',serif;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;pointer-events:none;animation:fl 1.3s ease forwards;white-space:nowrap}
.float.good{color:var(--gold)}.float.bad{color:#ff7a66}
@keyframes fl{0%{opacity:0;margin-top:14px;scale:.6}18%{opacity:1;margin-top:0;scale:1.15}75%{opacity:1;scale:1}100%{opacity:0;margin-top:-44px}}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe) + 24px) 22px calc(var(--safeb) + 24px)}
.logo{font-family:'Bree Serif',serif;font-size:64px;line-height:.95;color:#fff;-webkit-text-stroke:10px var(--line);paint-order:stroke fill;text-shadow:0 8px 0 var(--line);letter-spacing:1px}
.logo-sub{margin-top:14px;display:inline-block;background:var(--line);color:#fff;font-weight:800;font-size:13px;letter-spacing:1px;padding:6px 14px;border-radius:999px}
.flagbig{width:84px;height:126px;margin:26px auto 4px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(43,47,58,.85))}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.cap{font-weight:900;font-size:13px;letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.cityname{font-family:'Bree Serif',serif;font-size:34px;color:#fff;-webkit-text-stroke:7px var(--line);paint-order:stroke fill;margin:2px 0 22px}
.pickrow{display:flex;gap:14px;margin-top:26px}
.pick{appearance:none;border:3px solid var(--line);border-radius:20px;background:var(--cream);box-shadow:0 6px 0 var(--line);padding:12px 18px 14px;font-family:'Bree Serif',serif;font-size:20px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.pick img{width:48px;height:72px}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}

.ofit{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:350px}
.opt{border:3px solid var(--line);border-radius:18px;background:#fff;padding:12px 8px 12px;box-shadow:0 5px 0 var(--line);transition:transform .1s;position:relative}
.opt.sel{background:#fff1c9;outline:4px solid var(--gold);outline-offset:-1px}
.opt.sel:after{content:"✓";position:absolute;right:-8px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--ok);border:3px solid var(--line);color:#fff;font-weight:900;font-size:15px;line-height:22px}
.opt svg{width:58px;height:58px;display:block;margin:0 auto 4px}
.opt h4{margin:0;font-family:'Bree Serif',serif;font-weight:400;font-size:18px}
.opt p{margin:2px 0 0;font-size:13px;font-weight:700;color:#6b7680}
.sec{font-family:'Bree Serif',serif;font-size:18px;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;margin:18px 0 10px;align-self:center}

/* approach panel */
#approach{position:fixed;left:12px;right:12px;bottom:calc(var(--safeb) + 14px);padding:30px 14px 14px}
.ap-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.ap-box{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:12px;color:#6b7680}
.ap-box img{width:36px;height:54px}
.sealI{width:46px;height:46px}
.vs{font-family:'Bree Serif',serif;font-size:24px;color:#9aa6ae}
.match{font-family:'Bree Serif',serif;font-size:16px;padding:4px 10px;border-radius:10px;border:2.5px solid var(--line)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.act{appearance:none;border:3px solid var(--line);border-radius:16px;padding:8px 4px 10px;background:#fff;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Bree Serif',serif;font-size:15px;color:var(--ink)}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.act svg{width:40px;height:40px}
.act small{font-family:Nunito;font-weight:800;font-size:11px;color:#6b7680}

/* chapter card */
.yearcard{padding:34px 22px 24px;width:100%;max-width:340px}
.year{font-family:'Bree Serif',serif;font-size:76px;line-height:1;color:var(--ink)}
.cardline{font-weight:800;font-size:17px;line-height:1.35;margin:10px 0 18px;color:#3c4752}
.vignette{height:120px;margin:4px 0 6px}

/* log puzzle */
.log{width:100%;max-width:360px;padding:30px 12px 14px}
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.slot{height:66px;border:3px dashed #9aa6ae;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#f2ead6;position:relative}
.slot .n{width:26px;height:26px;border-radius:50%;background:var(--line);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.slot.filled{border-style:solid;border-color:var(--line);background:#fff}
.slot.right{background:#dff4dc;border-color:var(--ok-d)}.slot.wrong{background:#ffe1dc;border-color:#d0452f;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arrow{height:12px;display:flex;justify-content:center;margin:-4px 0}
.arrow:before{content:"";width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid var(--line)}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.lc{appearance:none;border:3px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);padding:6px 8px;display:flex;align-items:center;gap:8px;text-align:left;font-family:Nunito;font-weight:800;font-size:13px;line-height:1.15;color:var(--ink);min-height:62px}
.lc svg,.slot svg{width:44px;height:44px;flex:none}
.lc.sel{background:#fff1c9;outline:4px solid var(--gold);outline-offset:-1px}
.lc.used{visibility:hidden}
.slot .t{font-weight:800;font-size:13px;line-height:1.15}

/* stamps */
#stamps{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe) + 12px);display:flex;gap:6px;padding:5px 8px;background:var(--cream);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);pointer-events:none}
#stamps i{width:34px;height:34px;border-radius:50%;border:2.5px dashed #b9b2a0;display:flex;align-items:center;justify-content:center;background:#f2ead6}
#stamps i.on{border:2.5px solid var(--line);background:#fff;animation:pop .45s}
#stamps i svg{width:28px;height:28px}
@keyframes pop{0%{transform:scale(1.8)}100%{transform:none}}
#bigstamp{position:fixed;left:50%;top:42%;width:300px;padding:28px 16px 16px;text-align:center;transform:translate(-50%,-50%) scale(.6) rotate(-6deg);opacity:0;transition:all .35s cubic-bezier(.2,1.5,.5,1);pointer-events:none}
#bigstamp.on{pointer-events:auto;opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
#bigstamp.fly{opacity:0;transform:translate(-50%,-260%) scale(.25);transition:all .5s ease-in}
#bigstamp svg{width:110px;height:110px}
#bigstamp .hist{font-weight:700;font-size:14.5px;line-height:1.45;margin:10px 2px 14px;color:#3b4250}
#bigstamp .when{font-weight:900;font-size:12px;letter-spacing:.08em;color:#8a6d2b;margin-top:4px}
#bigstamp .cap2{font-family:'Bree Serif',serif;font-size:20px;line-height:1.15;margin-top:6px}
/* receipt */
.rec{width:300px;padding:34px 22px 22px;text-align:center}
.rec .big{font-family:'Bree Serif',serif;font-size:84px;line-height:1;color:var(--ink)}
.rec .lbl{font-weight:800;font-size:13px;color:#6b7680}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars i{width:34px;height:34px;background:#d6dde0;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%);transition:all .3s}
.stars i.on{background:var(--gold)}
.rline{border-top:3px dashed #d6cdb6;margin:14px 0 12px}
.credit{position:fixed;bottom:calc(var(--safeb) + 10px);left:0;right:0;text-align:center;font-weight:700;font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.tut{position:fixed;left:50%;bottom:calc(var(--safeb) + 96px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;font-family:'Bree Serif',serif;font-size:19px;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill}
.finger{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid #fff;box-shadow:0 0 0 3px var(--line);animation:sw 1.5s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
</style>

<body>
<canvas id="c"></canvas>
<div id="hud" class="fade hide">
 <div class="chip"><img class="tb" id="hudFlag"><div><small id="hudVoy">VOYAGE 1 OF 3</small><span id="hudYear">1260</span></div></div>
 <div class="chip"><div class="coinI"></div><span id="purse">0</span></div>
</div>
<div id="route" class="fade hide"><div class="bar"></div></div>
<div id="hold" class="fade hide"></div>
<div id="coach" class="fade hide"></div>
<div id="stamps" class="fade hide"></div>
<div id="bigstamp" class="panel"><div class="ribbon N">Event</div><div id="bsIc"></div><div class="when" id="bsWhen"></div><div class="cap2" id="bsCap"></div><div class="hist" id="bsHist"></div><button class="btn small gold" id="bsBtn">Add to log</button></div>
<div id="ui"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#c'),cx=cv.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2),SW=0,SH=0;
function resize(){SW=innerWidth;SH=innerHeight;cv.width=SW*DPR;cv.height=SH*DPR}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const later=(ms,f)=>setTimeout(f,ms);

/* ---------------- side from QR ---------------- */
const qs=new URLSearchParams(location.search),qv=(qs.get('side')||qs.get('s')||location.hash.slice(1)||'').toLowerCase();
let SIDE=qv.startsWith('g')?'G':qv.startsWith('v')?'V':null;
const CITY={V:'Venice',G:'Genoa'};
const OTHER=s=>s==='V'?'G':'V';

/* ---------------- art: flags & seals ---------------- */
const FL={
 ven:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60"><path d="M3 3h34v42l-5.7 11-5.6-11-5.7 11-5.7-11L8.6 56 3 45z" fill="#d9443b" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="22" r="9" fill="#ffc94a" stroke="#2b2f3a" stroke-width="2.4"/><path d="M15 25c1-4 6-5 9-3l1 4-3-1v4h-2l-1-3-2 3h-2z" fill="#2b2f3a"/></svg>`,
 gen:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60"><path d="M3 3h34v46l-17 8-17-8z" fill="#fff" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/><path d="M16 4.5h8v50l-4 1.8-4-1.8zM4.5 20h31v8h-31z" fill="#e0453a"/><path d="M3 3h34v46l-17 8-17-8z" fill="none" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/></svg>`,
 latin:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60"><path d="M3 3h34v46l-17 8-17-8z" fill="#c0392b" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/><path d="M17 12h6v10h9v6h-9v14h-6V28H8v-6h9z" fill="#ffc94a" stroke="#2b2f3a" stroke-width="2"/></svg>`,
 byz:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60"><path d="M3 3h34v46l-17 8-17-8z" fill="#6a2c91" stroke="#2b2f3a" stroke-width="3" stroke-linejoin="round"/><g fill="#ffc94a" stroke="#2b2f3a" stroke-width="1.2"><path d="M20 19c-2 0-3 1.6-3 3.5v9l-5 5 2 2 4-3.4V41h4v-5.9l4 3.4 2-2-5-5v-9c0-1.9-1-3.5-3-3.5z"/><path d="M17 23 8 16l1 5.5 3.5 2.5-4 1 3.5 2.5H17zM23 23l9-7-1 5.5-3.5 2.5 4 1-3.5 2.5H23z"/><circle cx="14" cy="15" r="3"/><circle cx="26" cy="15" r="3"/></g></svg>`,
};
const SEAL={
 latin:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="#c0392b" stroke="#2b2f3a" stroke-width="3"/><path d="M20 11h6v9h9v6h-9v9h-6v-9h-9v-6h9z" fill="#ffc94a" stroke="#2b2f3a" stroke-width="2"/></svg>`,
 byz:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="#6a2c91" stroke="#2b2f3a" stroke-width="3"/><g fill="#ffc94a" transform="translate(3 2)"><path d="M20 15c-2 0-3 1.6-3 3.5v8l-5 4.5 2 2 4-3V34h4v-4l4 3 2-2-5-4.5v-8c0-1.9-1-3.5-3-3.5z"/><path d="M17 19 9 13l1 5 3 2-3.5 1 3 2H17zM23 19l8-6-1 5-3 2 3.5 1-3 2H23z"/><circle cx="14.5" cy="12" r="2.6"/><circle cx="25.5" cy="12" r="2.6"/></g></svg>`,
};
const imgs={};function svgImg(s){if(!imgs[s]){const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);imgs[s]=i}return imgs[s]}
Object.values(FL).forEach(svgImg);
const furl=k=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(FL[k]);
const surl=k=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(SEAL[k]);

/* ---------------- history: who rules the gate, whose papers work ---------------- */
// gate ruler per voyage; for voyage 1 (1261) it switches during the approach
const VOY=[
 {year:1260,ruler:'latin',line:'Crusaders rule Constantinople. <b>Venice</b> is their partner and trades through freely.',seed:5},
 {year:1261,ruler:'latin',switchTo:'byz',fleet:true,line:'Genoa makes a pact with the <b>Greek emperor</b>: Genoese ships for him, trading rights for Genoa.',seed:9},
 {year:1263,ruler:'byz',battle:true,line:'The Greek emperor rules the city again. Venice and Genoa are <b>at war</b> at sea.',seed:13},
];
// papers each side carries, by voyage
const PAPERS={V:['latin','latin','latin'],G:[null,'byz','byz']};
// who the ruler favours
const FAV={latin:'V',byz:'G'};

/* ---------------- state ---------------- */
const G={scene:'title',t:0,v:0,purse:0,bales:6,cap:6,crew:'row',load:'full',camY:0,shake:0,log:[],gates:[]};

/* ---------------- input ---------------- */
const ptr={down:false,x:0,y:0};
cv.addEventListener('pointerdown',e=>{ptr.down=true;ptr.x=e.clientX;ptr.y=e.clientY});
addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY});
addEventListener('pointerup',()=>ptr.down=false);addEventListener('pointercancel',()=>ptr.down=false);

/* ---------------- UI helpers ---------------- */
const ui=$('#ui');const setUI=h=>ui.innerHTML=h;
function coach(html,ms=3200){const c=$('#coach');c.innerHTML=html;c.classList.remove('hide');clearTimeout(c._h);if(ms)c._h=setTimeout(()=>c.classList.add('hide'),ms)}
const uncoach=()=>$('#coach').classList.add('hide');
function float(txt,cls,x,y){const d=document.createElement('div');d.className='float '+(cls||'');d.textContent=txt;d.style.left=(x??SW/2)+'px';d.style.top=(y??SH*.45)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function hud(on){['#hud','#hold','#route'].forEach(s=>$(s).classList.toggle('hide',!on))}
function drawHold(hit){let s='';for(let i=0;i<G.cap;i++)s+=`<div class="bale${i>=G.bales?' lost':''}${i===hit?' hit':''}"></div>`;$('#hold').innerHTML=s}
function setPurse(v){const el=$('#purse');const a=+el.textContent,st=performance.now();const f=n=>{const k=Math.min(1,(n-st)/600);el.textContent=Math.round(lerp(a,v,k));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function loseBales(n,why){n=Math.min(n,G.bales);if(!n)return;G.bales-=n;drawHold(G.bales);buzz(70);float(`−${n} bale${n>1?'s':''}`,'bad',SW/2,SH*.38);}

/* =========================================================
   GEOGRAPHY  (schematic route: Aegean → Dardanelles → Marmara → Bosporus/Constantinople → Black Sea)
   ========================================================= */
const WW=600,L=3500;
const SEG={dard:[1350,1900],marm:[1900,2450],bos:[2560,2900],gate:2760,black:2950};
function halfW(y){
 let w=235;
 w=lerp(w,78,sstep(1250,1420,y));     // into Dardanelles
 w=lerp(w,205,sstep(1880,2020,y));    // Sea of Marmara
 w=lerp(w,66,sstep(2440,2590,y));     // Bosporus
 w=lerp(w,250,sstep(2880,3020,y));    // Black Sea
 return w+Math.sin(y/130)*6;
}
function center(y){return 300+34*Math.sin(y/520)+(y>1300&&y<1950?-20:0)*sstep(1250,1400,y)}
const LE=y=>center(y)-halfW(y),RE=y=>center(y)+halfW(y);
const LABELS=[[600,'Aegean Sea'],[1600,'Dardanelles'],[2150,'Sea of Marmara'],[SEG.gate,'Constantinople'],[3250,'Black Sea']];

/* =========================================================
   WORLD
   ========================================================= */
let W=null;
const ship={x:300,y:80,vx:0,a:0,inv:0,spd:150,hold:false};
function blob(n,rng){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([Math.cos(a)*(.8+rng()*.35),Math.sin(a)*(.8+rng()*.35)])}return p}
function build(v){
 const V=VOY[v],rng=seeded(V.seed);
 const w={isl:[],pir:[],npc:[],smoke:[],wake:[],parts:[],cur:[],ruler:V.ruler,gateState:'closed',blockers:[],battle:null};
 // Aegean islands
 for(let y=380;y<1150;y+=rnd(150,210)){w.isl.push({x:center(y)+rnd(-150,150),y,r:rnd(26,46),p:blob(16,rng),tr:[...Array(4)].map(()=>[rnd(-.5,.5),rnd(-.5,.5)])})}
 // Marmara islands
 for(let y=2060;y<2380;y+=rnd(150,200)){w.isl.push({x:center(y)+rnd(-120,120),y,r:rnd(22,34),p:blob(14,rng),tr:[[0,0],[.3,.2]]})}
 // Black Sea islands (few)
 w.isl.push({x:center(3200)+140,y:3200,r:30,p:blob(14,rng),tr:[[0,0]]});
 // pirates in the Aegean
 w.pir.push({x:center(700)+120,y:700},{x:center(1050)-120,y:1050});
 // Dardanelles current (helps if you keep to the middle)
 w.cur.push({y0:1450,y1:1850,boost:1.35});
 // fleet event (1261): Venetian war galleys pass you heading for the Black Sea
 if(V.fleet)for(let k=0;k<5;k++)w.npc.push({kind:'fleet',x:center(1700)+(k%2?-22:22),y:1700+k*60,sail:'ven',spd:260,a:0});
 // battle (1263) in the Aegean
 if(V.battle){w.battle={x:center(900)+70,y:900,r:110};for(let k=0;k<8;k++)w.npc.push({kind:'war',x:w.battle.x+rnd(-80,80),y:w.battle.y+rnd(-70,70),sail:k%2?'ven':'gen',spd:0,a:rnd(-3,3)})}
 // Black Sea traffic shows who has access
 const bsSail=v===0?'ven':'gen';
 for(let k=0;k<6;k++)w.npc.push({kind:'amb',x:center(3050+k*70)+rnd(-200,200),y:3050+k*70,sail:k===5?OTHERS(bsSail):bsSail,spd:rnd(40,70),a:rnd(-.4,.4)});
 // Bosporus guard galleys (form the blockade line)
 for(let k=0;k<3;k++)w.blockers.push({k,x:center(SEG.gate)-50+k*50,y:SEG.gate,a:Math.PI/2,ox:0});
 return w;
}
function OTHERS(s){return s==='ven'?'gen':'ven'}

/* =========================================================
   SAILING
   ========================================================= */
function startVoyage(){
 $('#stamps').classList.toggle('hide',G.v!==1);if(G.v===1){G.stamps=[];drawStamps()}
 W=build(G.v);ship.x=center(80);ship.y=80;ship.vx=0;ship.a=0;ship.inv=0;ship.hold=false;
 ship.spd=(G.crew==='row'?175:150)-(G.load==='full'?15:0);
 G.camY=0;G.pause=false;G.scene='sail';G.fl={};G.run=null;

function hitShip(){if(ship.inv>0||G.bales<=0||G.god)return;ship.inv=1.8;G.shake=10;loseBales(1)}
function updateSail(dt){
 if(G.pause)return;
 const w=W,s=SW/WW;
 if(ptr.down&&!ship.hold){const tx=ptr.x/s;ship.vx=lerp(ship.vx,clamp((tx-ship.x)*3.2,-240,240),dt*5);const t=$('#tut');if(t){t.remove()}}
 else ship.vx=lerp(ship.vx,0,dt*2.5);
 let vy=ship.hold?0:ship.spd;for(const c of w.cur)if(ship.y>c.y0&&ship.y<c.y1&&Math.abs(ship.x-center(ship.y))<40)vy*=c.boost;
 if(G.run)vy*=1.1;
 ship.x+=ship.vx*dt;ship.y+=vy*dt;ship.a=lerp(ship.a,clamp(ship.vx/320,-.5,.5),dt*6);ship.inv=Math.max(0,ship.inv-dt);
 const le=LE(ship.y),re=RE(ship.y);
 if(ship.x<le+13){ship.x=le+15;ship.vx=90;hitShip()}
 if(ship.x>re-13){ship.x=re-15;ship.vx=-90;hitShip()}
 for(const i of w.isl){const d=Math.hypot(ship.x-i.x,ship.y-i.y);if(d<i.r+11){const k=(i.r+13)/Math.max(d,1);ship.x=i.x+(ship.x-i.x)*k;ship.vx=ship.x>i.x?130:-130;hitShip()}}
 for(const p of w.pir){const dy=p.y-ship.y;if(!p.on&&dy<480&&dy>-40)p.on=true;
  if(p.on&&!p.gone){const tx=ship.x-p.x,ty=ship.y+70-p.y,d=Math.hypot(tx,ty)||1,sp=dy>0?70:100;p.x+=tx/d*sp*dt;p.y+=ty/d*sp*dt;p.a=Math.atan2(tx,ty);
   if(Math.hypot(ship.x-p.x,ship.y-p.y)<34){if(G.crew==='bow'){spark(p.x,p.y);float('Driven off!','good',ship.x*s,SH*.55)}else hitShip();p.gone=1;p.sink=1}
   if(ship.y-p.y>420)p.gone=1}
  if(p.sink)p.sink=Math.max(0,p.sink-dt)}
 for(const n of w.npc){if(n.kind==='demo'){n.y+=n.spd*dt;n.x=lerp(n.x,center(n.y),dt*2)}
  if(n.kind==='fleet'&&ship.y>1250){n.y+=n.spd*dt;n.x=lerp(n.x,center(n.y),dt*2);n.a=0}
  if(n.kind==='amb'){n.y+=n.spd*dt*.4;n.x+=Math.sin(G.t*.5+n.y)*dt*10}}
 if(VOY[G.v].fleet&&!G.fl.fleet&&ship.y>1330){G.fl.fleet=1;stamp(1)}
 if(w.battle){const b=w.battle;if(Math.hypot(ship.x-b.x,ship.y-b.y)<b.r)hitShip();if(Math.random()<dt*12)w.smoke.push({x:b.x+rnd(-80,80),y:b.y+rnd(-60,60),r:rnd(10,18),l:1});
  if(!G.fl.bat&&ship.y>500){G.fl.bat=1;coach(`A sea battle! <b>Venice</b> beats a <b>Genoese</b> fleet. Steer clear!`,3800)}}
 // the Gate
 if(!G.fl.app&&ship.y>SEG.gate-330){G.fl.app=1;approach()}
 if(G.run)updateRun(dt);
 else if(ship.y>SEG.gate-70&&w.gateState==='closed'){ship.y=SEG.gate-70;ship.vx*=.5}
 // wake & particles
 if(Math.random()<dt*36&&!ship.hold)w.wake.push({x:ship.x+rnd(-4,4),y:ship.y-30,l:1});
 w.wake.forEach(p=>p.l-=dt*.75);w.wake=w.wake.filter(p=>p.l>0);
 w.smoke.forEach(p=>{p.l-=dt*.35;p.r+=dt*10});w.smoke=w.smoke.filter(p=>p.l>0);
 w.parts.forEach(p=>{p.l-=dt*1.5;p.x+=p.vx*dt;p.y+=p.vy*dt});w.parts=w.parts.filter(p=>p.l>0);
 // blockers move
 for(const b of w.blockers){const tgt=(w.gateState==='open'||w.gateState==='demo')?(b.k-1)*190:0;b.ox=lerp(b.ox,tgt,dt*1.6)}
 G.camY=lerp(G.camY,ship.y-(SH*.3)/s,ship.hold?dt*3:1);
 const me=$('#me');if(me)me.style.bottom=`calc(${clamp(ship.y/L,0,1)*100}% - 9px)`;
 if(G.v===1&&!G.fl.s3&&ship.y>SEG.gate+200){G.fl.s3=1;stamp(3)}
 if(ship.y>L-120&&!G.fl.arr){G.fl.arr=1;arriveSoldaia()}
}

function openGate(escort){W.gateState='open';later(500,()=>{ship.hold=false});if(escort){const sail=SIDE==='V'?'ven':'gen';W.npc.push({kind:'escort',x:ship.x+40,y:ship.y-10,sail,spd:0,a:0,follow:1})}}
/* run the blockade: guard ships patrol across the strait; slip past them */
function startRun(){
 ship.hold=false;W.gateState='run';G.run={t:0};
 W.guards=[0,1,2].map(k=>({x:center(SEG.gate)+(k-1)*45,y:SEG.gate-40+k*70,ph:k*2.1,amp:52,spd:1.6+k*.35}));

}
function updateRun(dt){
 G.run.t+=dt;
 for(const g of W.guards){g.x=center(g.y)+Math.sin(G.t*g.spd+g.ph)*g.amp;
  if(Math.hypot(ship.x-g.x,ship.y-g.y)<36&&ship.inv<=0){loseBales(Math.min(2,G.bales));ship.inv=2;G.shake=12;coach(`Caught! The guards seize cargo.`,2000)}}
 if(ship.y>SEG.gate+170){G.run=null;W.gateState='open'}
}

 }

 else for(const g of W.guards){galley(g.x*s,sy(g.y),Math.PI/2+Math.cos(G.t*g.spd+g.ph)*.5,0.9,SAIL[W.ruler==='latin'?'latin':'guard'],t,{fast:1})}
}
function drawSoldaia(){const s=S(),y=L+40,Y=sy(y);if(Y<-200)return;
 cx.fillStyle='rgba(140,230,230,.45)';cx.fillRect(0,Y-30*s,SW,30*s);cx.fillStyle='#8fcf5e';cx.fillRect(0,0,SW,Y-6*s);cx.fillStyle='#fbe7b4';cx.fillRect(0,Y-6*s,SW,14*s);
 for(let k=0;k<9;k++){const x=150+k*36,yy=y+40+(k%3)*24;cx.fillStyle='#f7efe0';cx.fillRect((x-12)*s,sy(yy)-10*s,24*s,20*s);cx.fillStyle='#e0603f';cx.fillRect((x-12)*s,sy(yy)-10*s,24*s,7*s);cx.strokeStyle='rgba(43,47,58,.55)';cx.lineWidth=1.5*s;cx.strokeRect((x-12)*s,sy(yy)-10*s,24*s,20*s)}
 cx.fillStyle='#8a5a2e';cx.fillRect(280*s,Y-2*s,40*s,40*s);cx.strokeStyle='#2b2f3a';cx.lineWidth=2*s;cx.strokeRect(280*s,Y-2*s,40*s,40*s);
 cx.font=`${18*s}px 'Bree Serif'`;cx.textAlign='center';cx.lineWidth=5*s;cx.strokeStyle='#2b2f3a';cx.strokeText('Soldaia',300*s,sy(y+150));cx.fillStyle='#fff';cx.fillText('Soldaia',300*s,sy(y+150))}
function drawLabels(){const s=S();cx.textAlign='center';cx.font=`${15*s}px 'Bree Serif'`;
 for(const[y,n]of LABELS){if(n==='Constantinople')continue;const Y=sy(y+120);if(Y<-20||Y>SH+20)continue;cx.fillStyle='rgba(255,255,255,.55)';cx.fillText(n,center(y)*s,Y)}}
function drawSail(t){
 const s=S(),w=W;drawWater(t);
 for(const p of w.wake){cx.fillStyle=`rgba(255,255,255,${p.l*.6})`;cx.beginPath();cx.arc(p.x*s,sy(p.y),(2+(1-p.l)*7)*s,0,7);cx.fill()}
 // current hint in Dardanelles
 for(const c of w.cur){for(let i=0;i<6;i++){const y=c.y0+((i*80+t*160)%(c.y1-c.y0));const X=center(y)*s,Y=sy(y);cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=2.5*s;cx.beginPath();cx.moveTo(X-6*s,Y+5*s);cx.lineTo(X,Y);cx.lineTo(X+6*s,Y+5*s);cx.stroke()}}
 w.isl.forEach(drawIsland);drawLand(t);drawLabels();drawCity(t);drawSoldaia();
 if(w.battle){const b=w.battle;cx.fillStyle='rgba(255,90,60,.16)';cx.beginPath();cx.arc(b.x*s,sy(b.y),b.r*s,0,7);cx.fill();cx.setLineDash([8*s,6*s]);cx.strokeStyle='rgba(255,90,60,.6)';cx.lineWidth=3*s;cx.stroke();cx.setLineDash([])}
 for(const n of w.npc){if(n.kind==='escort'){n.x=lerp(n.x,ship.x+44,.08);n.y=lerp(n.y,ship.y-12,.08)}galley(n.x*s,sy(n.y),n.a,.95,SAIL[n.sail],t+n.x,{fast:n.kind==='fleet'})}
 for(const p of w.smoke){cx.fillStyle=`rgba(90,90,90,${p.l*.4})`;cx.beginPath();cx.arc(p.x*s,sy(p.y),p.r*s,0,7);cx.fill()}
 if(w.battle&&Math.sin(t*10)>.8){cx.fillStyle='#ffd27a';cx.beginPath();cx.arc((w.battle.x+rnd(-60,60))*s,sy(w.battle.y+rnd(-50,50)),5*s,0,7);cx.fill()}
 for(const p of w.pir){if(!p.on||(p.gone&&!p.sink))continue;cx.globalAlpha=p.gone?p.sink:1;galley(p.x*s,sy(p.y),p.a||Math.PI,.85,SAIL.pir,t*1.3,{dark:1,fast:1});cx.globalAlpha=1}
 for(const p of w.parts){cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x*s,sy(p.y),3*s,0,7);cx.fill();cx.globalAlpha=1}
 if(ptr.down&&!ship.hold){cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=3;cx.beginPath();cx.arc(ptr.x,sy(ship.y),15,0,7);cx.stroke()}
 if(!(ship.inv>0&&Math.sin(t*30)>0))galley(ship.x*s,sy(ship.y),ship.a,1.15,SAIL[SIDE==='V'?'ven':'gen'],t,{cargo:G.bales});
}

/* =========================================================
   SCREENS
   ========================================================= */
function title(){
 G.scene='menu';hud(false);uncoach();
 setUI(`<div class="screen"><div class="logo">THE<br>GATE</div><div class="logo-sub">CONSTANTINOPLE · 1260–1263</div>
 ${SIDE?`<img class="flagbig" src="${furl(SIDE==='V'?'ven':'gen')}"><div class="cap">YOU ARE A MERCHANT CAPTAIN OF</div><div class="cityname">${CITY[SIDE]}</div><button class="btn gold" onclick="outfit()">Play</button>`
 :`<div class="pickrow"><button class="pick" onclick="pick('V')"><img src="${furl('ven')}">Venice</button><button class="pick" onclick="pick('G')"><img src="${furl('gen')}">Genoa</button></div><div class="cap" style="margin-top:14px">Pick your city</div>`}
 </div><div class="credit">Merchant encounters are historical reconstructions.</div>`);
}
window.pick=s=>{SIDE=s;title()};
const OI={
 row:`<svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#cfeefa" stroke="#2b2f3a" stroke-width="3"/><path d="M12 33h34l-5 8H17z" fill="#a8683a" stroke="#2b2f3a" stroke-width="2.6" stroke-linejoin="round"/><g stroke="#2b2f3a" stroke-width="3" stroke-linecap="round"><path d="M18 32 12 44M25 32l-4 13M32 32l-2 13M39 32l-1 13"/></g><path d="M14 22h12M10 27h10" stroke="#2f6fd1" stroke-width="3" stroke-linecap="round"/></svg>`,
 bow:`<svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#ffe3d6" stroke="#2b2f3a" stroke-width="3"/><path d="M16 16c14 2 22 10 24 24" stroke="#a8683a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M16 16 40 40" stroke="#2b2f3a" stroke-width="1.8"/><path d="M13 33h22" stroke="#2b2f3a" stroke-width="3" stroke-linecap="round"/><path d="M34 29l8 4-8 4z" fill="#2b2f3a"/></svg>`,
 full:`<svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#fff1c9" stroke="#2b2f3a" stroke-width="3"/>${[0,1,2].map(r=>[0,1].map(c=>`<rect x="${16+c*14}" y="${15+r*10}" width="12" height="9" rx="2" fill="#e7c47a" stroke="#2b2f3a" stroke-width="2.2"/>`).join('')).join('')}</svg>`,
 light:`<svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#e3f5d9" stroke="#2b2f3a" stroke-width="3"/>${[1,2].map(r=>[0,1].map(c=>`<rect x="${16+c*14}" y="${15+r*10}" width="12" height="9" rx="2" fill="#e7c47a" stroke="#2b2f3a" stroke-width="2.2"/>`).join('')).join('')}<path d="M20 15l9-6 9 6" stroke="#4cbb57" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};
window.outfit=()=>{G.scene='menu';
 setUI(`<div class="screen"><div class="sec" style="font-size:26px;margin-top:0">Fit out your galley</div>
 <div class="sec">Crew</div><div class="ofit">
 <div class="opt ${G.crew==='row'?'sel':''}" onclick="setO('crew','row')">${OI.row}<h4>Rowers</h4><p>Faster ship</p></div>
 <div class="opt ${G.crew==='bow'?'sel':''}" onclick="setO('crew','bow')">${OI.bow}<h4>Crossbowmen</h4><p>Beat off pirates</p></div></div>
 <div class="sec">Cargo</div><div class="ofit">
 <div class="opt ${G.load==='full'?'sel':''}" onclick="setO('load','full')">${OI.full}<h4>6 bales</h4><p>More profit, slower</p></div>
 <div class="opt ${G.load==='light'?'sel':''}" onclick="setO('load','light')">${OI.light}<h4>4 bales</h4><p>Less profit, quicker</p></div></div>
 <div style="height:26px"></div><button class="btn" onclick="castOff()">Cast off!</button></div>`)};
window.setO=(k,v)=>{G[k]=v;outfit()};
window.castOff=()=>{G.cap=G.load==='full'?6:4;G.bales=G.cap;G.v=0;G.purse=0;$('#purse').textContent=0;G.gates=[];fadeTo(chapter)};
const VIG=[
 // 1260: crusader flag + venetian flag together
 ()=>`<svg class="vignette" viewBox="0 0 200 120"><path d="M30 110h140" stroke="#2b2f3a" stroke-width="3"/><g transform="translate(60 18)"><path d="M0 0v92" stroke="#2b2f3a" stroke-width="3"/><image href="${furl('latin')}" x="2" y="0" width="40" height="60"/></g><g transform="translate(110 30)"><path d="M0 0v80" stroke="#2b2f3a" stroke-width="3"/><image href="${furl('ven')}" x="2" y="0" width="34" height="51"/></g></svg>`,
 // 1261: two seals join
 ()=>`<svg class="vignette" viewBox="0 0 200 120"><image href="${surl('byz')}" x="38" y="28" width="60" height="60"/><image href="${furl('gen')}" x="110" y="22" width="44" height="66"/><text x="104" y="68" font-family="Bree Serif" font-size="26" fill="#2b2f3a" text-anchor="middle">+</text></svg>`,
 // 1263: crossed flags at war
 ()=>`<svg class="vignette" viewBox="0 0 200 120"><g transform="rotate(-18 80 60)"><path d="M80 10v100" stroke="#2b2f3a" stroke-width="3"/><image href="${furl('ven')}" x="82" y="10" width="34" height="51"/></g><g transform="rotate(18 120 60)"><path d="M120 10v100" stroke="#2b2f3a" stroke-width="3"/><image href="${furl('gen')}" x="84" y="10" width="34" height="51"/></g></svg>`
];
function chapter(){
 G.scene='menu';hud(false);uncoach();const V=VOY[G.v];
 setUI(`<div class="screen"><div class="panel yearcard"><div class="ribbon ${G.v===1?'N':SIDE}">Voyage ${G.v+1} of 3</div><div class="year">${V.year}</div>${VIG[G.v]()}<div class="cardline">${V.line}</div><button class="btn gold" onclick="fadeTo(startVoyage)">Set sail</button></div></div>`);
}

/* ---------------- event stamps (collected in 1261, reused in the log) ---------------- */
function drawStamps(){const el=$('#stamps');el.innerHTML=[0,1,2,3].map(i=>G.stamps.includes(i)?`<i class="on">${LOG[i].ic()}</i>`:'<i></i>').join('')}
function stamp(id,done){if(G.stamps.includes(id)){done&&done();return}uncoach();G.pause=true;const b=$('#bigstamp'),L0=LOG[id];
 $('#bsIc').innerHTML=L0.ic();$('#bsCap').textContent=L0.t;$('#bsWhen').textContent=L0.w;$('#bsHist').textContent=L0.h;
 b.classList.remove('fly');b.classList.add('on');buzz(30);
 $('#bsBtn').onclick=()=>{b.classList.add('fly');later(450,()=>{b.classList.remove('on','fly');G.stamps.push(id);drawStamps();G.pause=false;done&&done()})}}
/* ---------------- Captain's log: rebuild the chain of causes ---------------- */
const LOG=[
 {id:0,w:'MARCH 1261',h:'The Greek emperor wants Constantinople back but has no navy. He promises Genoa trading rights in return for warships.',t:'Genoa makes a pact with the Greek emperor',ic:()=>`<svg viewBox="0 0 44 44"><image href="${surl('byz')}" x="0" y="8" width="26" height="26"/><image href="${furl('gen')}" x="24" y="6" width="20" height="30"/></svg>`},
 {id:1,w:'JULY 1261',h:'The Venetian fleet that guards Constantinople sails off to attack an island in the Black Sea. The city is left almost undefended.',t:"Venice's fleet sails off to the Black Sea",ic:()=>`<svg viewBox="0 0 44 44"><path d="M8 30q14 8 28 0l-3-4H11z" fill="#a8683a" stroke="#2b2f3a" stroke-width="2.4"/><path d="M22 26V6l12 16z" fill="#d9443b" stroke="#2b2f3a" stroke-width="2.4" stroke-linejoin="round"/><path d="M4 38h36" stroke="#33b8cc" stroke-width="3" stroke-linecap="round"/></svg>`},
 {id:2,w:'25 JULY 1261',h:'A small Greek force slips into the city at night. The crusader emperor flees, ending 57 years of Latin rule backed by Venice.',t:'A Greek army takes Constantinople',ic:()=>`<svg viewBox="0 0 44 44"><path d="M10 6v34" stroke="#2b2f3a" stroke-width="3"/><image href="${furl('byz')}" x="11" y="4" width="22" height="33"/></svg>`},
 {id:3,w:'AFTER 1261',h:'The emperor rewards his ally. Genoa takes over the trade rights Venice used to hold, and Venice is pushed out of the Black Sea route.',t:'The Gate opens for Genoa and closes on Venice',ic:()=>`<svg viewBox="0 0 44 44"><circle cx="9" cy="22" r="7" fill="#d9c9a6" stroke="#2b2f3a" stroke-width="2.4"/><circle cx="35" cy="22" r="7" fill="#d9c9a6" stroke="#2b2f3a" stroke-width="2.4"/><path d="M16 22h12" stroke="#2b2f3a" stroke-width="3" stroke-dasharray="3 3"/><image href="${furl('gen')}" x="17" y="2" width="11" height="17"/></svg>`},
];
let LG=null;
function logPuzzle(){
 G.scene='menu';hud(false);uncoach();$('#stamps').classList.add('hide');
 const order=[...LOG].sort(()=>Math.random()-.5);if(order.every((c,i)=>c.id===i))order.reverse();
 LG={slots:[null,null,null,null],sel:null,order,tries:0,score:0};
 renderLog();
}
function renderLog(){
 const g=LG;
 setUI(`<div class="screen"><div class="panel log"><div class="ribbon N">Captain's log</div>
 <div style="font-weight:800;font-size:15px;margin:2px 0 12px">Put your four 1261 events in order.</div>
 <div class="slots">${g.slots.map((c,i)=>`${i?'<div class="arrow"></div>':''}<div class="slot ${c!=null?'filled':''} ${g.mark?(g.mark[i]?'right':'wrong'):''}" onclick="place(${i})"><div class="n">${i+1}</div>${c!=null?LOG[c].ic()+`<div class="t">${LOG[c].t}</div>`:''}</div>`).join('')}</div>
 <div class="hand">${g.order.map(c=>`<button class="lc ${g.sel===c.id?'sel':''} ${g.slots.includes(c.id)?'used':''}" onclick="selC(${c.id})">${c.ic()}${c.t}</button>`).join('')}</div>
 ${g.slots.every(x=>x!=null)?`<button class="btn" onclick="checkLog()">Check my log</button>`:`<div style="font-weight:800;font-size:13px;color:#6b7680">Tap a card, then tap a slot</div>`}
 </div></div>`);
}
window.selC=id=>{LG.sel=LG.sel===id?null:id;LG.mark=null;renderLog()};
window.place=i=>{const g=LG;g.mark=null;if(g.sel==null){if(g.slots[i]!=null){g.slots[i]=null;renderLog()}return}
 const j=g.slots.indexOf(g.sel);if(j>=0)g.slots[j]=null;g.slots[i]=g.sel;g.sel=null;renderLog()};
window.checkLog=()=>{const g=LG;g.tries++;g.mark=g.slots.map((c,i)=>c===i);const right=g.mark.filter(Boolean).length;
 if(g.tries===1)g.score=right;renderLog();
 if(right===4){buzz([30,40,60]);later(900,receipt)}else{buzz(80);later(1200,()=>{g.slots=g.slots.map((c,i)=>c===i?c:null);g.mark=null;renderLog();coach(`${right} of 4 in place. Think: what happened <b>first</b>?`,2400)})}};

/* ---------------- receipt ---------------- */
function receipt(){
 uncoach();$('#stamps').classList.add('hide');
 const c=G.cap,best=SIDE==='V'?(c*3+(c-2)*3*2):((c-2)*3+c*3*2);
 const trade=clamp(Math.round(G.purse/best*2),0,2),insight=LG.score===4?1:0,bonus=trade+insight;
 setUI(`<div class="screen"><div class="panel rec"><div class="ribbon ${SIDE}">${CITY[SIDE]}</div>
 <div class="lbl">AT THE TABLE, GIVE</div><div class="big">+${bonus}</div><div class="lbl">coins next round to</div><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px"><img src="${furl(SIDE==='V'?'ven':'gen')}" style="width:40px;height:60px"><span style="font-family:'Bree Serif';font-size:36px;color:${SIDE==='V'?'var(--ven)':'var(--gen)'}">${CITY[SIDE]}</span></div>
 <div class="stars">${[0,1,2].map(i=>`<i class="${i<bonus?'on':''}"></i>`).join('')}</div>
 <div class="rline"></div><div style="font-weight:800;font-size:14px;line-height:1.6">Trade: ${G.purse} coins earned · ${'★'.repeat(trade)||'–'}<br>Captain's log: ${LG.score}/4 first try · ${insight?'★':'–'}</div>
 </div><div class="cap" style="margin-top:22px;font-size:14px">Show this screen at the table</div><div style="height:14px"></div><button class="btn small grey" onclick="location.reload()">Play again</button></div>`);
 buzz(60);
}

/* =========================================================
   LOOP
   ========================================================= */
let fadeA=0,fadeCb=null;function fadeTo(cb){fadeA=.001;fadeCb=cb}window.fadeTo=fadeTo;
function drawMenu(t){G.camY+=0;drawWater(t);const s=S();
 if(G.scene==='menu'&&SIDE){galley(SW*.5+Math.sin(t*.5)*24,SH*.9,Math.sin(t*.5)*.1,1.25,SAIL[SIDE==='V'?'ven':'gen'],t)}
}
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;G.t+=dt;
 cx.setTransform(DPR,0,0,DPR,0,0);
 if(G.shake>0){G.shake=Math.max(0,G.shake-dt*40);cx.translate(rnd(-1,1)*G.shake*.5,rnd(-1,1)*G.shake*.5)}
 if(G.scene==='sail'){updateSail(dt);drawSail(G.t)}else{G.camY=G.t*24;drawMenu(G.t)}
 if(fadeA>0){fadeA+=dt*1.8;const a=fadeA<1?fadeA:2-fadeA;cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=`rgba(30,120,140,${clamp(a,0,1)})`;cx.fillRect(0,0,SW,SH);if(fadeA>=1&&fadeCb){const f=fadeCb;fadeCb=null;f()}if(fadeA>=2)fadeA=0}
 requestAnimationFrame(frame)}
title();requestAnimationFrame(frame);
</script>
