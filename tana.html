:root{
 --ven:#d9443b;--gen:#2f6fd1;--ink:#24303a;--cream:#fff8ea;--line:#2b2f3a;
 --ok:#4cbb57;--ok-d:#2f8a3a;--gold:#ffc94a;--bad:#e0543f;--khan:#7a4fb0;
 --safe:env(safe-area-inset-top,0px);--safeb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1f8ea3;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{opacity:0!important;pointer-events:none!important}
.fade{transition:opacity .35s ease,transform .35s ease}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#ui>*{pointer-events:auto}
#ui>.pass{pointer-events:none}
/* buttons */
.btn{appearance:none;border:3px solid var(--line);border-radius:18px;padding:14px 26px 16px;font-family:'Bree Serif',serif;font-size:21px;color:#fff;background:var(--ok);box-shadow:0 6px 0 var(--line),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:#4a2c06;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.grey{background:#9aa6ae}
.btn.small{font-size:16px;padding:10px 16px 12px;border-radius:14px}
.panel{background:var(--cream);border:3px solid var(--line);border-radius:22px;box-shadow:0 8px 0 rgba(43,47,58,.85);position:relative}
.ribbon{position:absolute;left:50%;top:-20px;transform:translateX(-50%);padding:6px 20px 8px;border:3px solid var(--line);border-radius:12px;font-family:'Bree Serif',serif;font-size:18px;color:#fff;white-space:nowrap;box-shadow:0 4px 0 var(--line)}
.ribbon.V{background:var(--ven)}.ribbon.G{background:var(--gen)}.ribbon.N{background:#e09a2a}.ribbon.K{background:var(--khan)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safe) + 10px) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none;z-index:4}
.chip{display:flex;align-items:center;gap:7px;background:var(--cream);border:3px solid var(--line);border-radius:16px;padding:5px 11px 6px 6px;box-shadow:0 4px 0 var(--line);font-family:'Bree Serif',serif;font-size:18px}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}
.chip .tb{width:24px;height:36px}
.chip small{display:block;font-family:Nunito;font-weight:800;font-size:10.5px;color:#6b7680;line-height:1;margin-bottom:2px}
.chip svg{width:22px;height:22px;flex:none}
.coinI{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc94a 45%,#c98a1c);border:2.5px solid var(--line);flex:none}
.pips{display:flex;gap:3px}
.pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);background:#d6dde0;transition:background .3s}
.pips i.on{background:var(--ok)}
.mini{padding:4px 10px 5px 8px;font-size:13px;font-family:Nunito;font-weight:900;color:#6b7680}
/* speech bubble */
#say{position:fixed;left:10px;right:10px;top:calc(var(--safe) + 104px);display:flex;justify-content:center;pointer-events:none;z-index:5}
#say .b{display:flex;align-items:center;gap:10px;max-width:360px;background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:8px 14px 9px 8px;animation:pop .28s cubic-bezier(.2,1.6,.5,1)}
#say .av{width:50px;height:50px;flex:none}
#say .who{font-weight:900;font-size:11px;letter-spacing:.06em;line-height:1;margin-bottom:3px}
#say .tx{font-weight:800;font-size:15.5px;line-height:1.25}
#say .tx b{color:var(--ven)}
@keyframes pop{0%{transform:scale(.7) translateY(-8px);opacity:0}100%{transform:none;opacity:1}}
.float{position:fixed;transform:translateX(-50%);font-family:'Bree Serif',serif;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;pointer-events:none;animation:fl 1.3s ease forwards;white-space:nowrap;z-index:6}
.float.good{color:var(--gold)}.float.bad{color:#ff7a66}
